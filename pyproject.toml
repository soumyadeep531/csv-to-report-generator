[project]
name = "csv-to-report-generator"
version = "0.1.0"
description = "Automated Exploratory Data Analysis and Report Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
    "gradio>=4.0.0",
    "uvicorn[standard]>=0.52.4",
    "slowapi>=0.1.10",
]

[project.scripts]
start = "app.main:start"
app = "app.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
